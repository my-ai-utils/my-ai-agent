[package]
name = "ai-macros"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
proc-macro = true

[dependencies]
json-schema-macros-core = { tag = "0.1.0", git = "https://github.com/my-jet-tools/json-schema.git" }


syn = { version = "*", features = ["extra-traits"] }
quote = "*"
